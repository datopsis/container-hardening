name: Verify sources

# Retrieves each pinned source, checks it still matches its recorded digest,
# and regenerates the catalogues to confirm the committed Markdown is what the
# packages actually produce.
#
# This is the check that makes the pinning meaningful. Without it, "pinned by
# digest" means only that a digest was recorded once.
#
# It is deliberately separate from CI: it reaches the public internet, DISA
# replaces packages in place, and a failure here is a finding to review rather
# than a broken pull request.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-sources
  cancel-in-progress: false

jobs:
  verify:
    name: verify pinned sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Retrieve and verify pinned sources
        id: retrieve
        run: python scripts/verify-sources.py --fetch sources/

      - name: Check the rendered catalogues match the packages
        run: python scripts/build-srg-markdown.py --check

      - name: Report a drifted or replaced source
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning::A pinned source no longer matches its recorded digest,"
          echo "::warning::or the committed Markdown no longer matches the package."
          echo "::warning::Review before changing any digest: ${RUN_URL}"
