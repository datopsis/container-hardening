<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="t d">
<title id="t">Container workload runtime stack</title>
<desc id="d">A container workload's security context is enforced by the OpenShift security context constraint, then by the CRI-O and OCI runtime, then by kernel mechanisms, on an RHCOS or Linux host.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="569" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="40" y="20" width="520" height="180" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="300.0" y="41" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Container workload</text>
<text x="300.0" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">securityContext the image must work under</text>
<text x="54.0" y="79" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">runAsNonRoot</text>
<text x="54.0" y="97" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">arbitrary / random UID</text>
<text x="54.0" y="115" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">allowPrivilegeEscalation: false</text>
<text x="54.0" y="133" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">capabilities: drop [ALL]</text>
<text x="54.0" y="151" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">seccomp: RuntimeDefault</text>
<text x="54.0" y="169" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">SELinux enforcing</text>
<text x="304.0" y="79" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no hostPID / hostIPC</text>
<text x="304.0" y="97" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no hostPath unless approved</text>
<text x="304.0" y="115" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no privileged container</text>
<text x="304.0" y="133" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">readOnlyRootFilesystem</text>
<text x="304.0" y="151" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">explicit resource limits</text>
<text x="304.0" y="169" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">user namespace (hostUsers: false)</text>
<text x="575" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-11 to IMG-15</text>
<text x="575" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-31, IMG-32</text>
<text x="575" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-02, PLT-03, PLT-05</text>
<line x1="300" y1="200" x2="300" y2="230" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="230" width="520" height="58" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="300.0" y="251" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">OpenShift SCC</text>
<text x="300.0" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">restricted-v2, or restricted-v3 with user namespaces</text>
<text x="575" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-02, IMG-31, IMG-32</text>
<line x1="300" y1="288" x2="300" y2="318" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="318" width="520" height="44" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="300.0" y="339" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">CRI-O / OCI runtime</text>
<text x="575" y="345" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-08 (runtime patched)</text>
<line x1="300" y1="362" x2="300" y2="392" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="392" width="520" height="90" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="300.0" y="413" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Kernel mechanisms</text>
<text x="54.0" y="434" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">namespaces</text>
<text x="54.0" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">cgroups</text>
<text x="220.66666666666666" y="434" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">seccomp</text>
<text x="220.66666666666666" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">capabilities</text>
<text x="387.3333333333333" y="434" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">SELinux</text>
<text x="387.3333333333333" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">user namespaces</text>
<text x="575" y="435" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-07, PLT-05</text>
<line x1="300" y1="482" x2="300" y2="512" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="512" width="520" height="44" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="300.0" y="533" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">RHCOS / Linux host</text>
<text x="575" y="539" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">HST-01 to HST-05</text>
</svg>
