<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
<title id="t">Sequence: TLS, when a deployment mounts it</title>
<desc id="d">The deployment mounts a server block, a certificate, and a private key read-only. nginx reads them at startup and never writes them; it refuses a missing or empty key. A client then completes a TLS 1.2 or 1.3 handshake on port 8443 and the request proceeds as any other. The image authenticates no client.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="449" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="50" y="20" width="180" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="140.0" y="41" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Deployment</text>
<text x="140.0" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">mounts, read-only</text>
<line x1="140" y1="72" x2="140" y2="400" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="360" y="20" width="180" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="450.0" y="41" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">nginx</text>
<text x="450.0" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">at startup, then serving</text>
<line x1="450" y1="72" x2="450" y2="400" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="670" y="20" width="180" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="760.0" y="41" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Client</text>
<text x="760.0" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">verifies the certificate</text>
<line x1="760" y1="72" x2="760" y2="400" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="140" y1="120" x2="450" y2="120" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="295.0" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">mount server block, certificate, key</text>
<text x="295.0" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">PLT-06, IMG-16, ADR-0003</text>
<line x1="450" y1="165" x2="450" y2="165" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450.0" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">read at startup; refuse if missing or empty</text>
<text x="450.0" y="181" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">IMG-18: fails closed</text>
<line x1="760" y1="215" x2="450" y2="215" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="605.0" y="207" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">ClientHello to 8443</text>
<text x="605.0" y="231" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">SC-8: in transit</text>
<line x1="450" y1="260" x2="760" y2="260" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="605.0" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">certificate; TLS 1.2 or 1.3</text>
<text x="605.0" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">SC-8(1), SC-13, SC-23</text>
<line x1="760" y1="305" x2="450" y2="305" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="605.0" y="297" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">request over the established connection</text>
<text x="605.0" y="321" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">IA-2: no client certificate is asked for</text>
<rect x="40" y="350" width="380" height="78" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
<text x="52" y="370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">What the image does not do</text>
<text x="52" y="388" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">it does not issue, renew, or revoke the certificate (IA-5)</text>
<text x="52" y="404" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">it sets no cipher policy of its own; the mounted block does</text>
<text x="52" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">it makes no FIPS claim (SC-13, IA-7)</text>
</svg>
