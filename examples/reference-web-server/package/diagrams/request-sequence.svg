<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
<title id="t">Sequence: one HTTP request</title>
<desc id="d">A client opens a connection to port 8080, sends a request, and the worker resolves it against the document root: it answers with the file, or 404, and never reaches outside the root. It writes one access record. A malformed request is refused before any of that, and an error discloses no version.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="469" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="60" y="20" width="180" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="150.0" y="41" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Client</text>
<text x="150.0" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">anonymous</text>
<line x1="150" y1="72" x2="150" y2="420" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="360" y="20" width="180" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="450.0" y="41" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">nginx worker</text>
<text x="450.0" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">UID 1001, no capabilities</text>
<line x1="450" y1="72" x2="450" y2="420" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="660" y="20" width="180" height="52" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="750.0" y="41" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Filesystem</text>
<text x="750.0" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" font-style="italic">read-only root</text>
<line x1="750" y1="72" x2="750" y2="420" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="150" y1="120" x2="450" y2="120" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300.0" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">connect to 8080, send request</text>
<text x="300.0" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">IMG-14: unprivileged port</text>
<line x1="450" y1="165" x2="450" y2="165" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450.0" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">parse; refuse if malformed</text>
<text x="450.0" y="181" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">SI-10</text>
<line x1="450" y1="215" x2="750" y2="215" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="600.0" y="207" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">resolve under the document root only</text>
<text x="600.0" y="231" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">AC-3, SC-5</text>
<line x1="750" y1="255" x2="450" y2="255" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="600.0" y="247" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">the file, or nothing</text>
<line x1="450" y1="300" x2="150" y2="300" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="300.0" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">200 with the file, or 404</text>
<text x="300.0" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">SI-11: no version disclosed</text>
<line x1="450" y1="350" x2="450" y2="350" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450.0" y="342" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="middle">write one access record to stdout</text>
<text x="450.0" y="366" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="middle">AU-2, AU-3, AU-12</text>
<rect x="560" y="380" width="320" height="78" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
<text x="572" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">What cannot happen here</text>
<text x="572" y="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">no code of the caller's runs (SC-18)</text>
<text x="572" y="434" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">no write outside /tmp (IMG-15)</text>
<text x="572" y="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">no privilege is gained (IMG-13, AC-6)</text>
</svg>
