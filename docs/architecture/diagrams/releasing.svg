<svg xmlns="http://www.w3.org/2000/svg" width="920" height="458" viewBox="0 0 920 458" role="img" aria-labelledby="t d">
<title id="t">Releasing an image</title>
<desc id="d">Before tagging, a person checks that main is green and conformance says release eligible, that no deviation expires before the next release, that unfixed findings are inside their remediation window, that inputs are current, that decisions and worksheets are reviewed, that due manual reviews are done, and that the version is new with a changelog. Tagging then starts what CI enforces: release eligibility, the commit on main, each image pushed by digest and tested there, an index of exactly those digests, signatures and attestations, the version tag on the index's digest, and verification from a clean runner.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="919" height="457" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="200" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">A person checks, then tags</text>
<text x="580" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">CI enforces, or stops</text>
<rect x="30" y="52" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="200.0" y="73" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="44" y="73" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Main is green, and conformance says release eligible</text>
<line x1="200" y1="84" x2="200" y2="96" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="96" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="200.0" y="117" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="44" y="117" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">No deviation expires before the next release</text>
<line x1="200" y1="128" x2="200" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="140" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="200.0" y="161" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="44" y="161" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Unfixed findings are inside their remediation window</text>
<line x1="200" y1="172" x2="200" y2="184" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="184" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="200.0" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="44" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Inputs are current, or a refresh is under review</text>
<line x1="200" y1="216" x2="200" y2="228" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="228" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="200.0" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="44" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Decisions and worksheets are reviewed and current</text>
<line x1="200" y1="260" x2="200" y2="272" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="272" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="200.0" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="44" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Manual reviews that are due are done (ADR-0007)</text>
<line x1="200" y1="304" x2="200" y2="316" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="316" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="200.0" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="44" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">The version is new; the changelog says what changed</text>
<rect x="410" y="52" width="340" height="32" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="580.0" y="73" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="424" y="73" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Conformance: release eligible, or stop</text>
<text x="762" y="73" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-25, IMG-26</text>
<line x1="580" y1="84" x2="580" y2="96" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="96" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="580.0" y="117" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="424" y="117" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">The tagged commit is on main</text>
<text x="762" y="117" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-33</text>
<line x1="580" y1="128" x2="580" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="140" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="580.0" y="161" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="424" y="161" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Each image pushed by digest, tested there</text>
<text x="762" y="161" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-02, IMG-24</text>
<line x1="580" y1="172" x2="580" y2="184" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="184" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="580.0" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="424" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Index of exactly those digests</text>
<text x="762" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-24</text>
<line x1="580" y1="216" x2="580" y2="228" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="228" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="580.0" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="424" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Sign index and images; attest SBOMs, provenance</text>
<text x="762" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-21, IMG-22</text>
<line x1="580" y1="260" x2="580" y2="272" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="272" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="580.0" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="424" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Tag the index's digest with the version</text>
<text x="762" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-24</text>
<line x1="580" y1="304" x2="580" y2="316" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="316" width="340" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="580.0" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="424" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start">Verify from a clean runner</text>
<text x="762" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-21, IMG-22, IMG-24</text>
<path d="M 370 332 C 390 332, 390 68, 410 68" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="390" y="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="middle">tag vX.Y.Z</text>
</svg>
