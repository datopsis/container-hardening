<title id="t">The container supply chain</title>
<desc id="d">Security starts before the container exists: source, dependencies, a controlled build, SBOM, scanning, provenance, image scanning, signing, the registry, admission verification, deployment, runtime policy, monitoring, and continuous vulnerability reassessment, each mapped to the criteria or expectations that implement it.</desc>
