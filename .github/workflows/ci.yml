name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The DISA packages are not committed and are not available here, so this
      # verifies what *is* committed: the register, and the internal
      # consistency of the rendered catalogues. Verifying the Markdown against
      # the packages it derives from needs the packages, and is done by
      # verify-sources.yml.
      - name: Validate the register, catalogues, crosswalk, standard, controls, and tailoring
        run: python -m unittest tests.test_sources tests.test_crosswalk tests.test_standard tests.test_controls tests.test_tailoring tests.test_applicability tests.test_score tests.test_revision tests.test_worksheets tests.test_reviews -v

      # A change to the criteria makes the reference image's assessment stale
      # until its profile names the new revision.
      - name: Check the reference profile names a current revision
        run: python scripts/check-revision.py --profile examples/reference-web-server/hardening-profile.json

      # The statements follow the baseline and the component definition.
      - name: Check the reference image's control statements are current
        run: |
          python scripts/build-statements.py --check \
            --component examples/reference-web-server/oscal/component-definition.json \
            --decisions examples/reference-web-server/decisions.json \
            --crosswalk examples/reference-web-server/requirements-crosswalk.json \
            --image reference-web-server --out examples/reference-web-server/CONTROL-STATEMENTS.md

      # The diagrams need no source package, so their drift is checked here.
      - name: Check the diagrams match their generator
        run: python scripts/build-diagrams.py --check

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          annotations: true
