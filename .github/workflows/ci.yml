name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The DISA packages are not committed and are not available here, so this
      # verifies what *is* committed: the register, and the internal
      # consistency of the rendered catalogues. Verifying the Markdown against
      # the packages it derives from needs the packages, and is done by
      # verify-sources.yml.
      - name: Validate the source register, rendered catalogues, and crosswalk
        run: python -m unittest tests.test_sources tests.test_crosswalk -v

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          annotations: true
