<svg xmlns="http://www.w3.org/2000/svg" width="760" height="612" viewBox="0 0 760 612" role="img" aria-labelledby="t d">
<title id="t">The reference image's pipeline</title>
<desc id="d">The reference image's CI, in order: check the profile and component definition, install verified scanners, scan the source, retrieve and verify inputs, show a defective input stops the build, build with networking disabled, verify the running image, generate the bill of materials and run the vulnerability and malware gates, check the base is current, re-verify the latest release, score the evidence, and on a version tag publish, sign, attest, and verify.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="611" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="250" y="30" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#57606a" text-anchor="middle">.github/workflows/reference-image.yml</text>
<rect x="40" y="44" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="65" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="65" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Check the hardening profile and component definition</text>
<text x="478" y="65" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-26</text>
<line x1="250" y1="76" x2="250" y2="90" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="90" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Install the pinned, verified scanners</text>
<text x="478" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-02</text>
<line x1="250" y1="122" x2="250" y2="136" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="136" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Scan the source: secrets, dependencies, build definition</text>
<text x="478" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-34</text>
<line x1="250" y1="168" x2="250" y2="182" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="182" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="203" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="203" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Retrieve and verify every input (the only networked step)</text>
<text x="478" y="203" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-01, IMG-02</text>
<line x1="250" y1="214" x2="250" y2="228" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="228" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Show a tampered or missing input stops the build</text>
<text x="478" y="249" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-02, IMG-03</text>
<line x1="250" y1="260" x2="250" y2="274" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="274" width="420" height="32" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="250.0" y="295" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="295" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Build with networking disabled</text>
<text x="478" y="295" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-03</text>
<line x1="250" y1="306" x2="250" y2="320" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="320" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="341" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="341" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Run the image restricted; read every property back</text>
<text x="478" y="341" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-06 to IMG-20, IMG-30, IMG-32</text>
<line x1="250" y1="352" x2="250" y2="366" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="366" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="387" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="387" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Bill of materials; vulnerability and malware gates</text>
<text x="478" y="387" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-21, IMG-25, IMG-28</text>
<line x1="250" y1="398" x2="250" y2="412" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="412" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="433" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="433" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Fail on a base more than 30 days behind</text>
<text x="478" y="433" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-29</text>
<line x1="250" y1="444" x2="250" y2="458" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="458" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="479" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="479" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Re-verify the latest published release</text>
<text x="478" y="479" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-21, IMG-22, IMG-24</text>
<line x1="250" y1="490" x2="250" y2="504" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="504" width="420" height="32" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="250.0" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Score the evidence</text>
<text x="478" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">hardening 31/34</text>
<line x1="250" y1="536" x2="250" y2="550" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="550" width="420" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="250.0" y="571" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle"></text>
<text x="250" y="571" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">On a version tag: publish, sign, attest, verify</text>
<text x="478" y="571" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-21, IMG-22, IMG-24</text>
</svg>
