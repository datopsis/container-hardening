<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Data flow: what moves, and where it rests</title>
<desc id="d">A client's request crosses the platform boundary into the container boundary, where an nginx worker reads content from the read-only root filesystem and writes temporary files to a tmpfs. The response returns to the client; access and error records leave on the standard streams. Key material, when mounted, is read but never written, and never reaches the records.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="519" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="16" width="860" height="300" rx="10" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="32" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0969da" text-anchor="start">Trust boundary: the container</text>
<text x="868" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#0969da" text-anchor="end" font-style="italic">what is inside is what the image shipped, plus what was mounted</text>
<rect x="40" y="60" width="170" height="70" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="125.0" y="81" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Client</text>
<text x="54.0" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">anonymous</text>
<line x1="210" y1="95" x2="300" y2="95" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="255.0" y="87.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle">request</text>
<ellipse cx="390" cy="95" rx="90" ry="40" fill="#f6f8fa" stroke="#8c959f"/>
<text x="390" y="92.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">nginx worker</text>
<text x="390" y="110.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle">parses, routes, serves</text>
<text x="310" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">SI-10: malformed requests refused</text>
<line x1="480" y1="95" x2="580" y2="95" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="530.0" y="87.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle">response</text>
<rect x="580" y="60" width="170" height="70" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="665.0" y="81" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Client</text>
<text x="594.0" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">same connection</text>
<rect x="40" y="200" width="250" height="70" fill="#f6f8fa" stroke="none"/>
<line x1="40" y1="200" x2="290" y2="200" stroke="#8c959f" stroke-width="1.5"/>
<line x1="40" y1="270" x2="290" y2="270" stroke="#8c959f" stroke-width="1.5"/>
<text x="52" y="221" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Content, read-only</text>
<text x="52" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">/usr/share/nginx/html, mounted or shipped</text>
<line x1="290" y1="235" x2="340" y2="185" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="315.0" y="228.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">reads</text>
<rect x="330" y="280" width="250" height="60" fill="#f6f8fa" stroke="none"/>
<line x1="330" y1="280" x2="580" y2="280" stroke="#8c959f" stroke-width="1.5"/>
<line x1="330" y1="340" x2="580" y2="340" stroke="#8c959f" stroke-width="1.5"/>
<text x="342" y="301" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">tmpfs /tmp</text>
<text x="342" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">the only writable path</text>
<rect x="620" y="200" width="250" height="70" fill="#f6f8fa" stroke="none"/>
<line x1="620" y1="200" x2="870" y2="200" stroke="#8c959f" stroke-width="1.5"/>
<line x1="620" y1="270" x2="870" y2="270" stroke="#8c959f" stroke-width="1.5"/>
<text x="632" y="221" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Key material, read-only</text>
<text x="632" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">/etc/nginx/tls, when TLS is mounted</text>
<line x1="620" y1="235" x2="480" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="550.0" y="210.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="end">reads at startup</text>
<text x="600" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IA-5, IA-5(6), IMG-16: never written, never logged</text>
<rect x="40" y="360" width="300" height="86" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="190.0" y="381" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Access and error records</text>
<text x="54.0" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">standard output and standard error</text>
<text x="54.0" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">combined format; no log file</text>
<line x1="390" y1="135" x2="190" y2="360" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="290.0" y="265.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="end">writes</text>
<text x="40" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">AU-2, AU-3, AU-12, IMG-19</text>
<rect x="560" y="360" width="310" height="86" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="715.0" y="381" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">What does not flow</text>
<text x="574.0" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no outbound connection of its own</text>
<text x="574.0" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no key material into records or arguments</text>
<text x="560" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-30: declared behaviour; SC-8 on the wire</text>
</svg>
