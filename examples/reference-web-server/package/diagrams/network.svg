<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Network: what listens, and what it reaches</title>
<desc id="d">The image listens on 8080, and on 8443 when a deployment mounts TLS. It opens no outbound connection of its own: the declared behaviour lists no outbound destination, and the smoke suite reads the listening sockets back from /proc to confirm only the declared ports are open. Everything else is the platform's network policy.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="419" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="40" y="70" width="220" height="110" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="150.0" y="91" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Inbound</text>
<text x="54.0" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">8080, HTTP</text>
<text x="54.0" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">8443, HTTPS when mounted</text>
<text x="54.0" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">both above 1024</text>
<text x="40" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-14, IMG-30</text>
<line x1="260" y1="125" x2="340" y2="125" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="340" y="70" width="220" height="110" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="450.0" y="91" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">The image</text>
<text x="354.0" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">one master, N workers</text>
<text x="354.0" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no listener but the declared</text>
<text x="340" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-30: declared behaviour</text>
<rect x="640" y="70" width="220" height="110" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="750.0" y="91" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Outbound</text>
<text x="654.0" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">none of its own</text>
<text x="654.0" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no upstream, no telemetry</text>
<line x1="560" y1="125" x2="640" y2="125" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="640" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-30, PLT-10</text>
<rect x="40" y="250" width="820" height="90" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="450.0" y="271" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">What decides who may reach it</text>
<text x="54.0" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">network policy, deny by default in both directions, and the service or ingress in front of it</text>
<text x="54.0" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">mutual authentication between services, where the platform provides it</text>
<text x="40" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-10, PLT-18: the platform's half; the image imposes none of it</text>
</svg>
