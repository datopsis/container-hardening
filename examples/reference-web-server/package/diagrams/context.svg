<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Context: the reference web server and what surrounds it</title>
<desc id="d">Anonymous clients reach the image through the platform's ingress and network policy. The platform admits the image by verified digest, imposes its security context, and mounts content, an optional server block, and optional key material. The image serves HTTP, and writes its records to the standard streams, which the platform collects. Nothing else crosses into the container.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="419" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="16" width="860" height="250" rx="10" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="32" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0969da" text-anchor="start">Trust boundary: the platform</text>
<text x="868" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#0969da" text-anchor="end" font-style="italic">everything inside is what the platform admits and imposes</text>
<rect x="40" y="60" width="240" height="90" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="160.0" y="81" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Clients</text>
<text x="54.0" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">anonymous, unauthenticated</text>
<text x="54.0" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">HTTP, or HTTPS when mounted</text>
<text x="40" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">AC-14, IA-2: nobody is identified</text>
<line x1="280" y1="105" x2="360" y2="105" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="320" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle">requests</text>
<rect x="360" y="60" width="240" height="90" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="480.0" y="81" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">The image</text>
<text x="374.0" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">nginx 1.26, UID 1001:0</text>
<text x="374.0" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">read-only root, one tmpfs</text>
<text x="360" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-06 to IMG-20: what it is</text>
<line x1="600" y1="105" x2="680" y2="105" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="640" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle">records</text>
<rect x="680" y="60" width="180" height="90" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="770.0" y="81" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Log collection</text>
<text x="694.0" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">standard streams</text>
<text x="694.0" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">kept by the platform</text>
<text x="680" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">AU-9, PLT-09</text>
<rect x="360" y="196" width="240" height="56" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="480.0" y="217" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Mounted in, read-only</text>
<text x="374.0" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">content, server block, key</text>
<line x1="480" y1="196" x2="480" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="620" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-06, IMG-16, IMG-17</text>
<rect x="40" y="300" width="380" height="96" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="230.0" y="321" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Its supply chain, before any of this</text>
<text x="54.0" y="342" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">locked inputs, hermetic build, signed index,</text>
<text x="54.0" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">attested provenance and bill of materials</text>
<text x="40" y="412" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-01 to IMG-05, IMG-21, IMG-22, IMG-35</text>
<rect x="460" y="300" width="400" height="96" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="660.0" y="321" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">What never crosses in</text>
<text x="474.0" y="342" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no package manager, shell service, or admin path</text>
<text x="474.0" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">no outbound connection of its own; no secrets in env</text>
<text x="460" y="412" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">IMG-07, IMG-27, IMG-30, AC-6</text>
</svg>
