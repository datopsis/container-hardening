<text x="575" y="393" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-12, PLT-08</text>
<line x1="300" y1="410" x2="300" y2="434" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="434" width="520" height="170" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="300.0" y="455" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Admission policy</text>
<text x="54.0" y="476" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">known registry?</text>
<text x="54.0" y="494" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">signature valid?</text>
<text x="54.0" y="512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">approved signer?</text>
<text x="54.0" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">provenance valid?</text>
<text x="54.0" y="548" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">approved base?</text>
<text x="54.0" y="566" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">vulnerability threshold?</text>
<text x="54.0" y="584" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start">securityContext acceptable?</text>
<text x="575" y="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-01, PLT-02</text>
<line x1="300" y1="604" x2="300" y2="628" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="628" width="520" height="44" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="300.0" y="649" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">OpenShift</text>
<text x="575" y="655" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">PLT-02 to PLT-18</text>
<text x="40" y="712" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">Cosign verifies the image digest and in-toto attestations at the Harbor to OpenShift boundary.</text>
<text x="40" y="732" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">Product names are one worked implementation of the properties the criteria state.</text>
</svg>
