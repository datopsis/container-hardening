name: Reference image

# Builds the reference web server natively for amd64 and arm64, and verifies
# each against the criteria: inputs retrieved and verified in their own step,
# the source scanned before the build, assembly with networking disabled, a
# defective input shown to stop the build, the running image read back against
# every runtime property, and the built image gated on vulnerabilities,
# malware, and stale inputs. The evidence of each architecture is kept
# separately and judged by the conformance workflow, called the way any image
# calls it. On main, the badges it writes are published to the badges branch.
#
# A tag of the form reference-web-server/vX.Y.Z also releases what was
# verified, and only if conformance found it release eligible. Nothing is
# rebuilt: each architecture's verified image is pushed untagged by digest and
# tested again at that digest; an index naming exactly those digests is pushed,
# signed with every image it names, and attested; only then is the version tag
# added; and a fresh runner with no registry credentials verifies the result.

on:
  pull_request:
    paths:
      - "examples/reference-web-server/**"
      - "scripts/**"
      - "artifacts/**"
      - ".github/workflows/reference-image.yml"
  push:
    branches:
      - main
    paths:
      - "examples/reference-web-server/**"
      - "scripts/**"
      - "artifacts/**"
      - ".github/workflows/reference-image.yml"
    tags:
      - "reference-web-server/v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-image-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: examples/reference-web-server

env:
  IMAGE: ghcr.io/datopsis/reference-web-server
  REQUIREMENT_PATTERN: '^###\s+(RWS-\d{3})\s*$'

jobs:
  verify:
    name: build and verify (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      attestations: read
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      # Evidence about the source, the process, and the release is recorded
      # once; evidence about the built image, on every architecture.
      GENERIC: ${{ matrix.architecture == 'amd64' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Podman where the runner lacks it
        run: command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }

      - name: Show the container engine and architecture
        run: |
          podman version
          arch="$(podman info --format '{{.Host.Arch}}')"
          if [ "$arch" != "$ARCHITECTURE" ]; then echo "expected a native $ARCHITECTURE runner, got $arch" >&2; exit 1; fi

      - name: Work out the version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then version="${REF_NAME#reference-web-server/v}"; else version="0.0.0-ci"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Deviations are the exception register; an expired one fails here, and
      # conformance judges it again (IMG-26).
      - name: Check the hardening profile
        working-directory: .
        run: python scripts/check-profile.py examples/reference-web-server/hardening-profile.json

      - name: Check the component definition
        working-directory: .
        run: |
          python examples/reference-web-server/scripts/component.py --check
          python scripts/build-statements.py --check \
            --component examples/reference-web-server/oscal/component-definition.json \
            --decisions examples/reference-web-server/decisions.json \
            --crosswalk examples/reference-web-server/requirements-crosswalk.json \
            --image reference-web-server --out examples/reference-web-server/CONTROL-STATEMENTS.md
          python scripts/check-component.py examples/reference-web-server/oscal/component-definition.json \
            --requirements examples/reference-web-server/requirements.md \
            --crosswalk examples/reference-web-server/requirements-crosswalk.json \
            --requirement-pattern "$REQUIREMENT_PATTERN" \
            --profile examples/reference-web-server/hardening-profile.json

      # The tools that judge the image are pinned and verified like its inputs.
      - name: Install the pinned scanning tools
        run: python scripts/install_tools.py "$RUNNER_TEMP/tools"

      # Before the build, as IMG-34 requires.
      - name: Scan the source for secrets, dependencies, and build-definition issues
        if: env.GENERIC == 'true'
        run: python tests/gates.py source --bin "$RUNNER_TEMP/tools" --evidence evidence

      # The pipeline is an input too (IMG-35): its pins, permissions, and credentials.
      - name: Read the pipeline that builds and releases the image
        if: env.GENERIC == 'true'
        run: python tests/pipeline_checks.py --evidence evidence/pipeline.json

      # The only step with network access to inputs. It fetches exactly what
      # this architecture's lock names, and verifies it, before the build sees it.
      - name: Retrieve and verify inputs
        run: python scripts/acquire.py "$RUNNER_TEMP/bundle"

      - name: Show a defective input stops the build
        run: python tests/build_checks.py "$RUNNER_TEMP/bundle" --evidence evidence/build.json

      - name: Build with networking disabled
        run: python scripts/build.py "$RUNNER_TEMP/bundle" --tag localhost/reference-web-server:ci --version "$VERSION"

      - name: Verify the image against the criteria
        env:
          REVISION: ${{ github.sha }}
        run: python tests/smoke.py localhost/reference-web-server:ci --revision "$REVISION" --evidence evidence/smoke.json

      - name: Generate the bill of materials and run the vulnerability and malware gates
        run: python tests/gates.py image localhost/reference-web-server:ci --bundle "$RUNNER_TEMP/bundle" --bin "$RUNNER_TEMP/tools" --evidence evidence

      # A base more than 30 days behind its publisher stops the image (IMG-29).
      - name: Check the inputs are current
        if: env.GENERIC == 'true'
        run: python scripts/drift.py --enforce --report evidence/drift.json

      # What was published is re-verified on every run, as a consumer would.
      - name: Verify the latest published release
        if: env.GENERIC == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/release_checks.py --bin "$RUNNER_TEMP/tools" --evidence evidence/release-latest.json

      # One artifact per architecture, so no file can overwrite another's.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-image-evidence-${{ matrix.architecture }}
          path: examples/reference-web-server/evidence/
          if-no-files-found: warn

      # The image a release publishes is this one, byte for byte.
      - name: Save the verified image for release
        if: github.ref_type == 'tag'
        run: podman save --format docker-archive --output "$RUNNER_TEMP/image.tar" localhost/reference-web-server:ci

      - name: Keep the verified image
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-archive-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Judged exactly as an image repository is judged, from the evidence alone.
  conformance:
    name: conformance
    needs: verify
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: $/.github/workflows/conformance.yml
    with:
      standard-ref: ${{ github.sha }}
      profile: examples/reference-web-server/hardening-profile.json
      component: examples/reference-web-server/oscal/component-definition.json
      requirements: examples/reference-web-server/requirements.md
      crosswalk: examples/reference-web-server/requirements-crosswalk.json
      decisions: examples/reference-web-server/decisions.json
      requirement-pattern: '^###\s+(RWS-\d{3})\s*$'
      evidence-artifacts: reference-image-evidence-*
      score-artifact: reference-image-conformance

  # Published in this repository's badges branch, as any image publishes its
  # own; the README points at them.
  badges:
    name: badges
    needs: conformance
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    uses: $/.github/workflows/badges.yml
    with:
      score-artifact: reference-image-conformance
      path: reference-web-server

  # Each architecture's verified image, pushed untagged by its own digest, and
  # tested again at that digest before anything names it.
  candidate:
    name: candidate (${{ matrix.architecture }})
    needs: [verify, conformance]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'reference-web-server/v') && needs.conformance.outputs.release-eligible == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Podman where the runner lacks it
        run: command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }

      - name: Fetch the verified image and its evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reference-*-${{ matrix.architecture }}
          path: ${{ runner.temp }}/verified

      - name: Log in to the registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          echo "$TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin --authfile "$HOME/.docker/config.json"

      - name: Push the verified image by digest
        run: |
          python scripts/publish.py candidate "$RUNNER_TEMP/verified/reference-archive-$ARCHITECTURE/image.tar" \
            --authfile "$HOME/.docker/config.json" --out "$RUNNER_TEMP/digest"
          echo "DIGEST=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_ENV"

      # The pushed image must be the one conformance judged, and must pass again
      # where it will be served from.
      - name: Test the image at that digest
        env:
          REVISION: ${{ github.sha }}
        run: |
          podman pull --quiet --authfile "$HOME/.docker/config.json" "$IMAGE@$DIGEST" >/dev/null
          python - "$RUNNER_TEMP/verified/reference-image-evidence-$ARCHITECTURE/smoke.json" "$IMAGE@$DIGEST" <<'PY'
          import json, subprocess, sys
          verified = json.load(open(sys.argv[1]))["subject"]["image_id"]
          pushed = "sha256:" + subprocess.run(["podman", "image", "inspect", sys.argv[2], "--format", "{{.Id}}"],
                                              text=True, capture_output=True, check=True).stdout.strip().removeprefix("sha256:")
          if pushed != verified:
              raise SystemExit("the pushed image is " + pushed + ", but conformance judged " + verified)
          print("the pushed image is the verified image, " + verified)
          PY
          mkdir -p candidate
          python tests/smoke.py "$IMAGE@$DIGEST" --revision "$REVISION" --evidence candidate/smoke.json
          cp "$RUNNER_TEMP/digest" candidate/digest

      - name: Keep the candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-candidate-${{ matrix.architecture }}
          path: examples/reference-web-server/candidate/

  release:
    name: release
    needs: [conformance, candidate]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'reference-web-server/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.promote.outputs.version }}
      index: ${{ steps.index.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # A passing score is not permission to release; eligibility is (IMG-25, IMG-26).
      - name: Require release eligibility
        env:
          ELIGIBLE: ${{ needs.conformance.outputs.release-eligible }}
          SCORE: ${{ needs.conformance.outputs.score }}
        run: |
          if [ "$ELIGIBLE" != true ]; then
            echo "::error::not release eligible ($SCORE); see the conformance job's release blockers" >&2
            exit 1
          fi

      # Releases are cut only from reviewed commits on the default branch (IMG-33).
      - name: Require the tagged commit to be on main
        env:
          SHA: ${{ github.sha }}
        run: git merge-base --is-ancestor "$SHA" origin/main

      - name: Work out the version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#reference-web-server/v}" >> "$GITHUB_ENV"

      - name: Install the pinned tools
        run: python scripts/install_tools.py "$RUNNER_TEMP/tools"

      - name: Fetch the candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reference-candidate-*
          path: ${{ runner.temp }}/verified

      - name: Fetch the evidence each was verified with
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reference-image-evidence-*
          path: ${{ runner.temp }}/verified

      - name: Log in to the registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          # The default location, which podman, skopeo, cosign, and the
          # provenance action all read; the action reads no other.
          mkdir -p "$HOME/.docker"
          echo "DOCKER_CONFIG=$HOME/.docker" >> "$GITHUB_ENV"
          echo "$TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin --authfile "$HOME/.docker/config.json"

      # A version is published once (IMG-24). There is no latest tag.
      - name: Refuse a version that already exists
        run: |
          if skopeo inspect --authfile "$DOCKER_CONFIG/config.json" --raw "docker://$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists; a released version is never replaced" >&2
            exit 1
          fi

      - name: Push an index naming exactly the tested digests
        id: index
        run: |
          children=()
          for architecture in amd64 arm64; do
            children+=(--child "$architecture=$(cat "$RUNNER_TEMP/verified/reference-candidate-$architecture/digest")")
          done
          python scripts/publish.py index "${children[@]}" --authfile "$DOCKER_CONFIG/config.json" --out "$RUNNER_TEMP/index"
          echo "INDEX=$(cat "$RUNNER_TEMP/index")" >> "$GITHUB_ENV"
          echo "digest=$(cat "$RUNNER_TEMP/index")" >> "$GITHUB_OUTPUT"

      # The index and every image it names are signed; each image carries the
      # bill of materials generated from it.
      - name: Sign the index and its images, and attest each bill of materials
        run: |
          "$RUNNER_TEMP/tools/cosign" sign --yes --recursive "$IMAGE@$INDEX"
          for architecture in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/verified/reference-candidate-$architecture/digest")"
            "$RUNNER_TEMP/tools/cosign" attest --yes --type spdxjson \
              --predicate "$RUNNER_TEMP/verified/reference-image-evidence-$architecture/sbom.spdx.json" "$IMAGE@$digest"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.INDEX }}
          push-to-registry: true

      # The same digest, tagged; nothing is rebuilt or re-encoded.
      - name: Promote the index to its version
        id: promote
        run: |
          python scripts/publish.py promote "$INDEX" --version "$VERSION" --authfile "$DOCKER_CONFIG/config.json"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # A fresh runner with no registry credentials, as anyone pulling it would be.
  published:
    name: verify the published release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the pinned tools
        run: python scripts/install_tools.py "$RUNNER_TEMP/tools"

      - name: Verify the release from a clean environment
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          INDEX: ${{ needs.release.outputs.index }}
        run: |
          python tests/release_checks.py --bin "$RUNNER_TEMP/tools" --version "$VERSION" --expect-digest "$INDEX" \
            --evidence evidence/release-published.json

      - name: Keep the release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-release-evidence
          path: examples/reference-web-server/evidence/release-published.json
          if-no-files-found: warn
