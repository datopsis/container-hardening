# Reference web server configuration.
#
# Every path nginx writes is under /tmp, the one declared writable mount
# (IMG-15). Logs go to standard streams (IMG-19). Listeners are above 1024
# (IMG-14). TLS is enabled by mounting a server block, a certificate, and a key
# read-only into /etc/nginx/conf.d and /etc/nginx/tls (IMG-16, IMG-17).

worker_processes auto;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
